name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-and-build:
    name: Typecheck & Web Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript Compile Check
        run: npx tsc --noEmit

      - name: 🌐 Export Web Bundle (Vercel Compatibility Check)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://hhgsabphhgidxdfdhgdd.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoZ3NhYnBoaGdpZHhkZmRoZ2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzYzNTksImV4cCI6MjEwMjIxMjM1OX0.oStesJQjnaZmKhJQC97Lca2dC6xJGBD2WUxG6E81BFs' }}
        run: npx expo export -p web
